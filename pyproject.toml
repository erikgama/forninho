[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forninho"
version = "0.1.2"
description = "CLI de warm-up de banco para MySQL e Oracle HeatWave."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Erik Gama" }
]
keywords = ["mysql", "heatwave", "banco-de-dados", "warmup", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "typer==0.12.3",
  "click==8.1.7",
  "mysql-connector-python==9.0.0",
  "rich==13.7.1",
]

[project.urls]
"Página inicial" = "https://github.com/erikgama/forninho"
"Repositório" = "https://github.com/erikgama/forninho"
"Problemas" = "https://github.com/erikgama/forninho/issues"

[project.scripts]
forninho = "forninho:main"

[tool.setuptools]
py-modules = ["forninho"]

[tool.setuptools.packages.find]
include = ["core*"]
